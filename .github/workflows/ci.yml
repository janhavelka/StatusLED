# GitHub Actions CI for PlatformIO and native ESP-IDF consumers
name: CI

on:
  push:
    branches: [main, master, 'feature/**']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        environment:
          - cli_esp32s3_idf
          - cli_esp32s2_idf
          - cli_esp32s3_idf5
          - cli_esp32s2_idf5
          - cli_esp32s3_neopixelbus
          - cli_esp32s2_neopixelbus
      fail-fast: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check text integrity
        run: python scripts/check_text_integrity.py

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install platformio

      - name: Build ${{ matrix.environment }}
        run: pio run -e ${{ matrix.environment }}

  test-native:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        environment: [native, native_max]
      fail-fast: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check text integrity
        run: python scripts/check_text_integrity.py

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install platformio

      - name: Run native tests (${{ matrix.environment }})
        run: pio test -e ${{ matrix.environment }}

  build-espidf:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          # Exercise the declared minimum and the supported 6.x driver API.
          - idf_version: v5.3
            target: esp32s2
            cache_safe: ""
          - idf_version: v5.3
            target: esp32s3
            cache_safe: CONFIG_RMT_ISR_IRAM_SAFE=y
          - idf_version: v6.0
            target: esp32s2
            cache_safe: ""
          - idf_version: v6.0
            target: esp32s3
            cache_safe: CONFIG_RMT_TX_ISR_CACHE_SAFE=y
      fail-fast: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Enable cache-safe RMT interrupts
        if: matrix.cache_safe != ''
        run: printf '%s\n' '${{ matrix.cache_safe }}' > examples/espidf_basic/sdkconfig.defaults

      - name: Build native ESP-IDF example
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: ${{ matrix.idf_version }}
          target: ${{ matrix.target }}
          path: examples/espidf_basic
