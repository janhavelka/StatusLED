; -------------------------
; Native unit tests
; -------------------------
[env:native]
platform = native
build_flags =
  -DSTATUSLED_BACKEND_NULL=1
  -DSTATUSLED_TEST=1
  -Iinclude
build_src_filter =
  +<src/**>
test_build_src = yes

; Exercise the public capacity limit and all fixed-size arrays at their maximum.
[env:native_max]
extends = env:native
build_flags =
  ${env:native.build_flags}
  ; Independent test expectation: removing/mistyping the capacity flag must fail.
  -DSTATUSLED_TEST_MAX_CAPACITY=1
  -DSTATUSLED_MAX_LED_COUNT=255
